# Infracost v2 - cost estimate comment on every PR that changes infrastructure.
# Docs: https://www.infracost.io/docs/integrations/github_actions/
name: Infracost

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "**/*.tfvars"
      - "**/values.yaml"

jobs:
  infracost:
    runs-on: ubuntu-latest
    container: ghcr.io/infracost/ci:2
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
      # Actions exposes this only as an expression, never as an environment
      # variable, and `diff` reads it from the environment.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@v4
        with:
          # The default ref on a pull_request event is the merge commit, whose
          # SHA and author are not the contributor's.
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - run: infracost-ci diff --base-path base --head-path head
